<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141926"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </radialGradient>
    
    <!-- Neon Cyan & Mint Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAlert" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1E2638" stroke-width="2"/>

  <!-- Outer Cyber Shield Contour -->
  <path d="M256 64 L416 128 C416 296 256 424 256 424 C256 424 96 296 96 128 Z"
        fill="#0D111A"
        stroke="url(#shieldBorder)"
        stroke-width="6"
        stroke-linejoin="round"
        filter="url(#glowCyan)"/>

  <!-- Concentric Radar Rings Inside Shield -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,6"/>
  <circle cx="256" cy="230" r="95" fill="none" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="230" r="60" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-opacity="0.6"/>
  <circle cx="256" cy="230" r="25" fill="none" stroke="#39FF14" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="90" x2="256" y2="370" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="116" y1="230" x2="396" y2="230" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Radar Sweep Ray (Pie sector) -->
  <path d="M256 230 L370 160 A130 130 0 0 0 256 100 Z" fill="url(#radarSweep)"/>

  <!-- Detected Threat Blip (Red Pulsing) -->
  <circle cx="310" cy="185" r="9" fill="#FF3D71" filter="url(#glowAlert)"/>
  <circle cx="310" cy="185" r="16" fill="none" stroke="#FF3D71" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Secondary Safe Blip (Green) -->
  <circle cx="205" cy="265" r="6" fill="#39FF14" filter="url(#glowCyan)"/>

  <!-- Center Target Core -->
  <circle cx="256" cy="230" r="6" fill="#00E5FF" filter="url(#glowCyan)"/>

  <!-- Brand Typography -->
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#E0F7FA" letter-spacing="4" text-anchor="middle">ROOM SWEEP SENTINEL</text>
  <text x="256" y="492" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#00E5FF" letter-spacing="2" text-anchor="middle">RF THREAT DETECTOR • 2026</text>
</svg>